[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailgun-mcp"
version = "0.5.2"
description = "Unofficial MCP server for the Mailgun API"
authors = [
    { name = "Les Leslie", email = "les@wedgwoodwebworks.com" },
]
requires-python = ">=3.14"
dependencies = [
    "fastmcp",
    "httpx2>=0.28.1",
    "mcp-common>=0.18.0",
    "oneiric>=0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mailgun_mcp"]

[dependency-groups]
dev = [
    "crackerjack>=0.39.1",
    "session-buddy>=0.4.0",
]

[tool.mailgun-mcp]
http_port = 3039
http_host = "127.0.0.1"
enable_http_transport = true

[tool.ruff]
target-version = "py314"
line-length = 88
fix = false
unsafe-fixes = true
show-fixes = true
output-format = "full"
extend-exclude = ["docs/archive/test-artifacts"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = [
    "C901",
    "F",
    "I",
    "UP",
]
ignore = [
    "E402",
    "F821",
]
fixable = [
    "ALL",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 300
testpaths = ["tests"]
addopts = "--cov=mailgun_mcp --cov-report=term"
markers = [
    "unit: marks test as a unit test",
    "benchmark: mark test as a benchmark",
    "integration: marks test as an integration test",
    "no_leaks: detect asyncio task leaks",
    "no_tool_wrapper: skip the _patch_tool_objects autouse fixture (W2b.1 tool profile wiring tests)",
]

[tool.creosote]
paths = [
    "mailgun_mcp",
]

[tool.crackerjack]
# Baseline configuration (auto-bootstrapped 2026-08-20).
# Hook stages run on `crackerjack run`; see crackerjack --help for the
# full lifecycle. refurb_timeout raised from default 300s to 420s because
# large refactor passes on first run can exceed 5 minutes on cold cache.
refurb_timeout = 420
